# BMCU 370C Klipper Integration — Generic Configuration
# Copy this file's contents into your printer.cfg
#
# Prerequisites:
#   1. Run ./install.sh (symlinks bmcu_feeder.py and bmcu_channel.py into Klipper)
#   2. Find your BMCU serial path:
#      ls /dev/serial/by-path/
#   3. Update the serial path below
#   4. Restart Klipper: sudo systemctl restart klipper

[bmcu_feeder]
# Serial port — MUST use /dev/serial/by-path/ for stable device assignment
# Find yours with: ls /dev/serial/by-path/
serial: /dev/serial/by-path/platform-3f980000.usb-usb-0:1.1.3:1.0-port0
baud: 115200
# How often to query BMCU status (seconds). Lower = more responsive but more serial traffic
poll_interval: 0.5

# Stall detection: an activity (liveness) check. A stall is raised when
# the encoder shows less than min_measured_mm of movement over
# stall_timeout_s while at least min_commanded_mm of forward extrusion was
# commanded in that span. No ratio, no correlation, no rolling window —
# just "did the encoder move at all". This requires extruder: to be set
# below — a channel with no extruder configured has stall detection
# disabled entirely (runout/insert detection are unaffected).
#
# Deprecated: slip_ratio, stall_window_polls and stall_startup_ignore_polls
# are still accepted and silently ignored, so an existing printer.cfg keeps
# booting. They will be removed in a later release — delete them from your
# config once you've migrated to the options below.

# Channel 0 — typically the first toolhead (T0)
[bmcu_channel 0]
extruder: extruder
runout_gcode:
    PAUSE
insert_gcode:
stall_gcode:
    PAUSE
event_delay: 3.0
pause_on_runout: True
# Leave True only if the BMCU feeder motor actually drives the filament
# during a print. On the common setup where the toolhead extruder pulls
# and the BMCU is a passive encoder, the feeder motor never runs, so the
# detector never evaluates — those setups must set this False.
require_motor_running: True
# Pauses the print on a detected blockage independently of stall_gcode,
# mirroring pause_on_runout.
pause_on_stall: True
# Encoder must show at least this much movement (mm) within stall_timeout_s
# to count as "alive" — the noise floor.
min_measured_mm: 1.0
# Encoder must show movement within this long (seconds) since forward
# extrusion started accumulating, or a stall fires. Independent of
# poll_interval — this is wall-clock time, not a poll count.
stall_timeout_s: 15.0
# Do not evaluate a stall until at least this much forward extrusion (mm)
# has been commanded since the last confirmed movement — ignores
# travel/retraction/slow features. min_commanded_mm / stall_timeout_s is
# the implied minimum sustained extrusion rate the detector can catch;
# below that rate it cannot fire. Logged at ready-time and exposed as
# bmcu_feeder.channels.N.stall_min_rate_mms.
min_commanded_mm: 5.0
# A non-ok magnet status (debounced) raises an encoder_fault event instead
# of a blockage and suspends stall evaluation — a dead sensor is not a jam.
# Defaults False: losing sight of the filament reports but does not pause,
# since stopping a good print to guard against a jam that may not exist is
# the more expensive mistake. Set True to stop rather than print unwatched.
pause_on_encoder_fault: False
# direction_invert: Uncomment if FWD ejects filament instead of feeding (V2.2 hardware has reversed motor wiring)
# direction_invert: True

# Channel 1 — second toolhead (T1)
[bmcu_channel 1]
extruder: extruder1
runout_gcode:
    PAUSE
insert_gcode:
stall_gcode:
    PAUSE
event_delay: 3.0
pause_on_runout: True
# Leave True only if the BMCU feeder motor actually drives the filament
# during a print. On the common setup where the toolhead extruder pulls
# and the BMCU is a passive encoder, the feeder motor never runs, so the
# detector never evaluates — those setups must set this False.
require_motor_running: True
# Pauses the print on a detected blockage independently of stall_gcode,
# mirroring pause_on_runout.
pause_on_stall: True
min_measured_mm: 1.0
stall_timeout_s: 15.0
min_commanded_mm: 5.0
pause_on_encoder_fault: False
# direction_invert: Uncomment if FWD ejects filament instead of feeding (V2.2 hardware has reversed motor wiring)
# direction_invert: True

# Channels 2 and 3 follow the same pattern
# Uncomment and configure as needed

# GCode Commands:
#   BMCU_RUN CHANNEL=N         — Start feeder motor on channel N
#   BMCU_STOP CHANNEL=N        — Stop feeder motor on channel N
#   BMCU_SPEED CHANNEL=N SPEED=75  — Set motor speed (0-100)
#   BMCU_DIR CHANNEL=N DIR=FWD — Set motor direction (FWD/REV)
#   BMCU_STATUS                — Print status table for all channels
#   BMCU_RESET_FEED            — Reset feed distance, stall count and the
#                                 activity tracker for all channels
#   BMCU_RESET_FEED CHANNEL=N  — Same, for channel N only
#   SET_BMCU_SENSOR CHANNEL=N ENABLE=0|1  — Enable/disable sensor for channel N
#
# Moonraker Objects (visible in Mainsail/Fluidd diagnostic panel):
#   bmcu_feeder.channels.N.feed_mm           — Raw encoder distance (mm)
#   bmcu_feeder.channels.N.feed_mm_since_reset — Distance since last BMCU_RESET_FEED
#   bmcu_feeder.channels.N.stall_count       — Cumulative stall events since last reset
#   bmcu_feeder.channels.N.filament_present   — Filament sensor state
#   bmcu_feeder.channels.N.motor_running      — Motor running state
#   bmcu_feeder.channels.N.stall_min_rate_mms — Implied minimum sustained
#                                 extrusion rate (min_commanded_mm / stall_timeout_s)
#                                 the detector can catch
#   bmcu_feeder.channels.N.seconds_since_movement — Time since the encoder
#                                 last showed confirmed movement
#   bmcu_feeder.channels.N.commanded_since_movement — Forward mm commanded
#                                 since the last confirmed movement
#   bmcu_feeder.channels.N.encoder_fault      — True while the magnet status
#                                 is faulted and stall evaluation is suspended
#
# Tip: Call BMCU_RESET_FEED from your PRINT_START macro so the opening
# purge starts from a clean slate — it clears the activity tracker too,
# not just the feed counters.
